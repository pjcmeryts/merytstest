name: Deploy Weather Report via Branch to GitHub Pages

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write # Wichtig: Die Action benötigt Schreibrechte, um auf den gh-pages Branch zu pushen

jobs:
  build-and-push-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: HTML mit Diagramm generieren
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 1. Wetterdaten von Open-Meteo laden
            const url = 'https://api.open-meteo.com/v1/forecast?latitude=52.52&longitude=13.41&daily=temperature_2m_max,temperature_2m_min,precipitation_sum&forecast_days=5&timezone=Europe/Berlin';
            const response = await fetch(url);
            const data = await response.json();

            const dates = JSON.stringify(data.daily.time);
            const maxTemps = JSON.stringify(data.daily.temperature_2m_max);
            const minTemps = JSON.stringify(data.daily.temperature_2m_min);

            // 2. HTML-Dokument erstellen
            const htmlContent = `<!DOCTYPE html>
            <html lang="de">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Wetterbericht Berlin</title>
              <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
              <style>
                body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f4f6f8; color: #333; }
                .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
                h1 { margin-top: 0; }
                .footer { margin-top: 20px; font-size: 0.85em; color: #666; text-align: right; }
              </style>
            </head>
            <body>
              <div class="card">
                <h1>🌤️ 5-Tage Wettervorhersage Berlin</h1>
                <canvas id="weatherChart"></canvas>
                <div class="footer">Zuletzt aktualisiert: ${new Date().toLocaleString('de-DE', { timeZone: 'Europe/Berlin' })}</div>
              </div>

              <script>
                const ctx = document.getElementById('weatherChart').getContext('2d');
                new Chart(ctx, {
                  type: 'line',
                  data: {
                    labels: ${dates},
                    datasets: [
                      {
                        label: 'Höchsttemperatur (°C)',
                        data: ${maxTemps},
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        fill: true,
                        tension: 0.3
                      },
                      {
                        label: 'Tiefsttemperatur (°C)',
                        data: ${minTemps},
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.3
                      }
                    ]
                  },
                  options: {
                    responsive: true,
                    plugins: { legend: { position: 'top' } },
                    scales: { y: { title: { display: true, text: 'Temperatur (°C)' } } }
                  }
                });
              </script>
            </body>
            </html>`;

            fs.mkdirSync('./public', { recursive: true });
            fs.writeFileSync('./public/index.html', htmlContent);

      - name: Auf gh-pages Branch pushen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
